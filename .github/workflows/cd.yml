name: CD

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/YOUR_SERVICE_ID/deploys
      - name: Wait for deploy health check
        run: |
          sleep 30
          curl --fail https://your-app.onrender.com/health